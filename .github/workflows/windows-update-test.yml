name: Windows real application update test

on:
  workflow_dispatch:
    inputs:
      from_version:
        description: Published version to install first
        default: '1.3.2'
        required: true
      to_version:
        description: Expected public latest version
        default: '1.3.3'
        required: true

permissions:
  contents: read

jobs:
  update:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install old release and exercise its real updater
        shell: pwsh
        env:
          FROM_VERSION: ${{ inputs.from_version }}
          TO_VERSION: ${{ inputs.to_version }}
        run: ./tests/windows-update.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-update-evidence
          path: update-evidence/
