name: Build signed desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      # Serialize release asset uploads; publish generates the complete manifest.
      max-parallel: 1
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            args: --target aarch64-apple-darwin --bundles app,dmg
            pattern: Space-Dictation_[version]_macOS-Apple-Silicon[ext]
          - name: Windows x64
            runner: windows-2022
            args: --bundles nsis
            pattern: Space-Dictation_[version]_Windows-x64[setup][ext]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: Read versioned release notes
        id: notes
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo 'body<<SPACE_RELEASE_NOTES'
            cat "docs/releases/v$VERSION.md"
            echo 'SPACE_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"
      - name: Build signed installers and updater manifest
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: 空格听写 v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}
          assetNamePattern: ${{ matrix.pattern }}
  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish only after both platform builds finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: zhang-jincheng/space-dictation
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/build-update-manifest.mjs "$VERSION" "$RUNNER_TEMP/update-manifest"
          gh release upload "v$VERSION" "$RUNNER_TEMP/update-manifest/latest.json" --clobber
          node scripts/verify-release.mjs "$RUNNER_TEMP/update-manifest/latest.json" "$VERSION"
          gh release upload "v$VERSION" docs/images/poster-hero.png docs/images/poster-features.png docs/images/poster-platforms.png docs/images/poster-mac-install-v1.3.1.png --clobber
          gh release edit "v$VERSION" --draft=false --latest --notes-file "docs/releases/v$VERSION.md"
